services:
  db:
    image: postgres:16-alpine
    container_name: shipyard-db
    environment:
      POSTGRES_USER: shipyard
      POSTGRES_PASSWORD: shipyard
      POSTGRES_DB: shipyard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipyard -d shipyard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: shipyard-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SHIPYARD_DATABASE_URL: postgresql+psycopg2://shipyard:shipyard@db:5432/shipyard
      SHIPYARD_SEED_DEMO: "1"
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: shipyard-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
